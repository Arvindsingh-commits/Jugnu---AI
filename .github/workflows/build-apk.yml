name: Build Jugnu AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Create Android Project
        working-directory: android_app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Microphone & Internet Permissions + App Icon
        working-directory: android_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          if [ -f "../website/assets/jugnu-logo.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "../website/assets/jugnu-logo.png" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "../website/assets/jugnu-logo.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi

      - name: Build Debug APK
        working-directory: android_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Jugnu-AI.apk
        uses: actions/upload-artifact@v4
        with:
          name: Jugnu-AI-APK
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
